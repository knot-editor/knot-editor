# No test may hang the suite: tests bound their own waits, and this terminates
# anything that still blocks (a 60 s period, killed after three).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Each test runs in its own process. CI reports every failure rather than
# stopping at the first.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

# `just test-timings` reads the per-test durations from this report.
[profile.timings]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[profile.timings.junit]
path = "junit.xml"
