[package]
name = "knot-host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
knot-protocol = { path = "../knot-protocol" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["sync"] }
url = "2"
v8 = "152.2"

[dev-dependencies]
pollster = "1"

[features]
test-support = []
