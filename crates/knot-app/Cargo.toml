[package]
name = "knot-app"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "knot_app"
path = "src/lib.rs"

[[bin]]
name = "knot"
path = "src/main.rs"

[dependencies]
knot = { path = "../.." }
knot-bundled = { path = "../knot-bundled" }
knot-ext-languages = { path = "../knot-ext-languages" }
knot-ext-vim = { path = "../knot-ext-vim" }
knot-ext-workbench = { path = "../knot-ext-workbench" }
gpui_platform = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland"] }

[dev-dependencies]
knot = { path = "../..", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
