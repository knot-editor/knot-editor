[package]
name = "knot-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
inventory = "0.3"
knot-handler-macros = { path = "../knot-handler-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["sync"] }

[features]
test-support = []
