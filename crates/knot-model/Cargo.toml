[package]
name = "knot-model"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Editor state and policy that need no UI toolkit, scripting runtime, or host.
[dependencies]
directories = { workspace = true }
jsonc-parser = { workspace = true }
knot-core = { path = "../knot-core" }
knot-protocol = { path = "../knot-protocol" }
percent-encoding = { workspace = true }
rusqlite = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-yaml = { workspace = true }
tree-sitter-md = { workspace = true }
tree-sitter-tsquery = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
knot-core = { path = "../knot-core", features = ["test-support"] }
pollster = { workspace = true }

[features]
# Test-only helpers for the application's tests.
test-support = ["knot-core/test-support"]
