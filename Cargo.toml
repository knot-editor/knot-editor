[workspace]
members = ["crates/*"]
default-members = [
    ".",
    "crates/knot-app",
    "crates/knot-bundled",
    "crates/knot-core",
    "crates/knot-ext-languages",
    "crates/knot-ext-vim",
    "crates/knot-ext-workbench",
    "crates/knot-handler-macros",
    "crates/knot-host",
    "crates/knot-model",
    "crates/knot-protocol",
]
resolver = "3"

# gpui-pre and its platform crate are one snapshot, and gpui-component pins
# it exactly; upgrade the three together when gpui-component releases.
[workspace.dependencies]
gpui-component = { version = "=0.9.0", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["font-kit", "windows-manifest"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit"] }
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
directories = "6"
inventory = "0.3"
jsonc-parser = { version = "0.34", features = ["serde", "serde_json"] }
libc = "0.2"
nucleo-matcher = "0.3.1"
percent-encoding = "2"
pollster = "1"
proc-macro2 = "1"
quote = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3"
tokio = { version = "1.53", features = ["sync"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-tsquery = "0.8.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
v8 = "152.2"

[package]
name = "knot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
inventory = { workspace = true }
knot-bundled = { path = "crates/knot-bundled" }
knot-core = { path = "crates/knot-core" }
knot-handler-macros = { path = "crates/knot-handler-macros" }
knot-host = { path = "crates/knot-host" }
knot-model = { path = "crates/knot-model" }
knot-protocol = { path = "crates/knot-protocol" }
alacritty_terminal = { workspace = true }
anyhow = { workspace = true }
directories = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
libc = { workspace = true }
jsonc-parser = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
v8 = { workspace = true }
rusqlite = { workspace = true }
nucleo-matcher = { workspace = true }
pollster = { workspace = true, optional = true }

[features]
# The product test driver in `knot::test_support`, for tests outside the library.
test-support = [
    "dep:pollster",
    "gpui/test-support",
    "gpui-component/test-support",
    "knot-core/test-support",
    "knot-host/test-support",
    "knot-model/test-support",
    "knot-protocol/test-support",
]

[dev-dependencies]
knot-core = { path = "crates/knot-core", features = ["test-support"] }
knot-host = { path = "crates/knot-host", features = ["test-support"] }
knot-model = { path = "crates/knot-model", features = ["test-support"] }
knot-protocol = { path = "crates/knot-protocol", features = ["test-support"] }
pollster = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }

[lib]
name = "knot"
path = "src/lib.rs"

# Startup compiles every bundled highlight query; unoptimized, the query
# compiler takes seconds, so debug builds and tests optimize the runtime.
[profile.dev.package.tree-sitter]
opt-level = 3

# Tests draw every dirty window after each update, and unoptimized layout and
# painting dominate product tests and the debug app.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3
