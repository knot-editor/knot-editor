name: libghostty

# Builds the libghostty-vt static libraries that crates/knot-terminal links,
# so no other build needs Zig. Each run publishes the release
# libghostty-vt-<version>; build.rs pins its archive names and checksums.

on:
  workflow_dispatch:
    inputs:
      version:
        description: libghostty-vt version, such as 1.0.1
        required: true
        type: string
      zig:
        description: Zig version matching minimum_zig_version in its build.zig.zon
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: libghostty-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  MINISIGN_KEY: RWQlAjJC23149WL2sEpT/l0QKy7hMIFhYdQOFy0Z7z7PbneUgvlsnYcV

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify the source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign
          base="https://release.files.ghostty.org/libghostty-vt/$VERSION"
          mkdir source
          cd source
          for file in "libghostty-vt-$VERSION.tar.gz" "libghostty-vt-$VERSION-deps.tar.gz"; do
            curl -fsSLO "$base/$file"
            curl -fsSLO "$base/$file.minisig"
            minisign -V -P "$MINISIGN_KEY" -m "$file"
            rm "$file.minisig"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: source
          retention-days: 1

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Darwin archive step uses Apple's libtool and xcrun, and the
          # MSVC target needs the Windows SDK, so those build on their hosts.
          # `arch` and `binutils` select the tools that hide every symbol
          # but the ghostty_* API. MSVC has no such tool, so Windows builds
          # without SIMD, which leaves out simdutf and Highway instead.
          - rust: aarch64-apple-darwin
            zig: aarch64-macos.13.0
            os: macos-latest
            arch: arm64
          - rust: x86_64-apple-darwin
            zig: x86_64-macos.13.0
            os: macos-latest
            arch: x86_64
          - rust: x86_64-unknown-linux-gnu
            zig: x86_64-linux-gnu
            os: ubuntu-24.04
          - rust: aarch64-unknown-linux-gnu
            zig: aarch64-linux-gnu
            os: ubuntu-24.04
            binutils: aarch64-linux-gnu-
          - rust: x86_64-pc-windows-msvc
            zig: x86_64-windows-msvc
            os: windows-latest
            options: -Dsimd=false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NAME: libghostty-vt-${{ inputs.version }}-${{ matrix.rust }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ inputs.zig }}
          use-cache: false
      - name: Build
        env:
          ZIG_TARGET: ${{ matrix.zig }}
        run: |
          set -euo pipefail
          cd source
          tar -xzf "libghostty-vt-$VERSION.tar.gz"
          tar -xzf "libghostty-vt-$VERSION-deps.tar.gz"
          cd "libghostty-vt-$VERSION"
          ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-cache" zig build \
            --prefix "$RUNNER_TEMP/install" \
            --system "../libghostty-vt-$VERSION-deps" \
            -Doptimize=ReleaseFast \
            -Dcpu=baseline \
            -Dtarget="$ZIG_TARGET" \
            -Dvt-features=-kitty-graphics \
            ${{ matrix.options }}
      - name: Install the cross binutils
        if: matrix.binutils
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-aarch64-linux-gnu
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
          BINUTILS: ${{ matrix.binutils }}
        run: |
          set -euo pipefail
          install="$RUNNER_TEMP/install"
          out="$RUNNER_TEMP/$NAME"
          mkdir -p "$out/lib" dist
          cp -R "$install/include" "$out/include"
          cp "source/libghostty-vt-$VERSION/LICENSE" "$out/LICENSE"
          if [ -f "$install/lib/libghostty-vt.a" ]; then
            # The archive also carries simdutf and Highway, which V8 links
            # in other versions under the same names. Merging it into one
            # object that exports only the ghostty_* API keeps them apart.
            merged="$RUNNER_TEMP/libghostty-vt.o"
            if [ "$RUNNER_OS" = macOS ]; then
              # Some internal ghostty_* symbols are private externs, which
              # ld refuses to export, so the list names the public ones.
              nm -m -U "$install/lib/libghostty-vt.a" | awk '
                NF > 2 && $NF ~ /^_ghostty_/ {
                  if ($(NF - 1) == "external" && $(NF - 2) != "private") api[$NF] = 1
                  else internal[$NF] = 1
                }
                END { for (s in api) if (!(s in internal)) print s }
              ' > "$RUNNER_TEMP/exports"
              ld -r -arch "$ARCH" -platform_version macos 13.0 13.0 \
                -all_load "$install/lib/libghostty-vt.a" \
                -exported_symbols_list "$RUNNER_TEMP/exports" -o "$merged"
            else
              "${BINUTILS}ld" -r --whole-archive "$install/lib/libghostty-vt.a" -o "$merged"
              "${BINUTILS}objcopy" --wildcard --keep-global-symbol='ghostty_*' "$merged"
            fi
            "${BINUTILS}ar" rcs "$out/lib/libghostty-vt.a" "$merged"
            exported=$("${BINUTILS}nm" -g --defined-only "$out/lib/libghostty-vt.a" \
              | awk 'NF == 3 && $3 !~ /^_?ghostty_/')
            if [ -n "$exported" ]; then
              echo "symbols outside the ghostty_* API are still global:" >&2
              echo "$exported" >&2
              exit 1
            fi
          else
            cp "$install"/lib/ghostty-vt-static.lib "$out/lib/"
          fi
          test -f "$out/include/ghostty/vt.h"
          tar -czf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP" "$NAME"
          tar -tzf "dist/$NAME.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: dist
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libghostty-vt-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ZIG: ${{ inputs.zig }}
        run: |
          set -euo pipefail
          tag="libghostty-vt-$VERSION"
          cd dist
          for archive in *.tar.gz; do
            sha256sum "$archive" | tee "$archive.sha256"
          done
          gh release create "$tag" ./* \
            --repo "$REPO" --target "$SHA" --latest=false \
            --title "libghostty-vt $VERSION" \
            --notes "Static libghostty-vt $VERSION for knot-terminal, built with Zig $ZIG (ReleaseFast, baseline CPU, without Kitty graphics) from the signed release tarballs. Only the ghostty_* API is global; the Windows build has no SIMD."
