name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check extensions
        run: scripts/check-extensions.sh
      - name: Select Rust toolchain
        run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check formatting
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - name: Test
        run: |
          cargo nextest run --locked --workspace --all-targets --profile ci
          cargo test --locked --workspace --doc

  handler-platforms:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Select Rust toolchain
        run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check handler declarations and linked discovery
        run: |
          cargo test --locked -p knot-handler-macros
          cargo test --locked -p knot-protocol
          cargo test --locked --lib extensions::host::declaration_tests
          cargo test --locked --lib app::command_declarations
          cargo test --locked --test handler_linking
          cargo test --locked --workspace --doc
      - name: Build product
        run: cargo build --locked --bin knot
